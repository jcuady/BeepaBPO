<!--
  The Beepa mark on a transparent canvas.

  This file previously carried a `<rect>` navy tile (#1F1C4F, rx=7) behind the
  two strokes. That tile was a hand-drawn re-interpretation of the logo, not the
  company's artwork, and it contradicted every favicon on the site: the shipped
  rasters in public/favicon-*.png and public/brand/icon-*.png are now generated
  from the real mark at public/brand/logo-mark-raw.png by
  scripts/generate-brand-icons.mjs. Removing the tile is what makes the vector
  and the raster the same brand mark rather than two different ones.

  Stroke colours are the current palette: green #008338, lime #93C63D.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <path
    d="M9 21.5V12c0-2.4 1.9-4.3 4.3-4.3h8.5"
    stroke="#008338"
    stroke-width="3.2"
    stroke-linecap="round"
  />
  <path
    d="M23 10.5v9.5c0 2.4-1.9 4.3-4.3 4.3H10.2"
    stroke="#93C63D"
    stroke-width="3.2"
    stroke-linecap="round"
  />
</svg>